<div class="absolute bottom-0 right-0 w-4 h-4 bg-tertiary-container rounded-full flex items-center justify-center text-on-tertiary shadow-sm">

<div class="w-full mt-4 pt-3 flex flex-col items-center">

<span class="material-symbols-outlined text-[16px]">visibility</span>

</button>
<div class="hidden w-full mt-2 p-3 bg-surface-container-low rounded-xl text-center" id="transcript-box">
<p class="font-body-md text-body-md text-on-surface italic">"¡Hola! Nos vemos en el café a las cinco y media de la tarde."</p>
</div>
</div>
</div>
<!-- Challenge Inquiry Box -->
<div class="px-1 mb-space-sm">
<p class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Pregunta</p>

</div>
<!-- Dual Tactile Answer Cards -->
<div class="grid grid-cols-1 gap-space-sm mb-space-md">
<!-- Option A -->
<button class="choice-tile group w-full min-h-[58px] bg-surface-container-lowest hover:bg-surface-container-low active:translate-y-0.5 p-4 rounded-xl shadow-[0_3px_12px_rgba(44,34,30,0.05)] flex items-center justify-between text-left transition-all cursor-pointer" data-correct="true">
<div class="flex items-center gap-3">
<span class="tile-indicator w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant group-hover:bg-primary-fixed group-hover:text-primary transition-colors">A</span>
<span class="tile-text font-headline-sm text-headline-sm text-on-surface">A las 5:30 PM</span>
</div>
<div class="tile-check w-6 h-6 rounded-full bg-surface-container-low flex items-center justify-center opacity-0 transition-opacity">
<span class="material-symbols-outlined text-[16px] text-tertiary" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Option B -->
<button class="choice-tile group w-full min-h-[58px] bg-surface-container-lowest hover:bg-surface-container-low active:translate-y-0.5 p-4 rounded-xl shadow-[0_3px_12px_rgba(44,34,30,0.05)] flex items-center justify-between text-left transition-all cursor-pointer" data-correct="false">
<div class="flex items-center gap-3">
<span class="tile-indicator w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant group-hover:bg-primary-fixed group-hover:text-primary transition-colors">B</span>
<span class="tile-text font-headline-sm text-headline-sm text-on-surface">A las 8:00 AM</span>
</div>
<div class="tile-check w-6 h-6 rounded-full bg-surface-container-low flex items-center justify-center opacity-0 transition-opacity">
<span class="material-symbols-outlined text-[16px] text-tertiary" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
</div>
<!-- Interactive Vocal Responder Deck -->
<div class="bg-surface-container-low rounded-2xl p-space-md flex flex-col items-center shadow-sm">
<div class="flex items-center justify-between w-full mb-3 px-1">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px] text-primary">record_voice_over</span>
<span class="font-label-md text-label-md text-on-surface font-semibold">Respuesta por voz</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant" id="mic-status">Toca para hablar</span>
</div>
<!-- Microphone & Live Dynamic Soundwave Dock -->
<div class="flex items-center gap-3 w-full bg-surface-container-lowest p-2 rounded-xl shadow-[0_2px_8px_rgba(44,34,30,0.04)]">
<button aria-label="Grabar respuesta por voz" class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container shadow-sm flex items-center justify-center active:scale-95 transition-transform shrink-0 cursor-pointer" id="mic-trigger">
<span class="material-symbols-outlined text-[24px]" id="mic-icon">mic</span>
</button>
<!-- Waveform Simulation Canvas/Bars -->
<div class="flex-1 flex items-center justify-center gap-1 h-8 px-2 overflow-hidden" id="waveform-container">
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-2 transition-all duration-150"></span>
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-3 transition-all duration-150"></span>
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-1.5 transition-all duration-150"></span>
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-4 transition-all duration-150"></span>
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-2.5 transition-all duration-150"></span>
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-5 transition-all duration-150"></span>
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-3 transition-all duration-150"></span>
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-1.5 transition-all duration-150"></span>
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-3.5 transition-all duration-150"></span>
<span class="waveform-bar w-1.5 bg-surface-container-highest rounded-full h-2 transition-all duration-150"></span>
</div>
<div class="shrink-0 pr-1">
<span class="text-tertiary font-label-sm text-label-sm font-semibold opacity-0 transition-opacity" id="mic-recognized">¡Excelente!</span>
</div>
</div>
</div>
</div>
<script>
  // Speed Toggle Interaction
  const btnSpeedNormal = document.getElementById('speed-normal');
  const btnSpeedTurtle = document.getElementById('speed-turtle');

  btnSpeedNormal.addEventListener('click', () => {
    btnSpeedNormal.className = "px-3 py-1.5 rounded-full bg-surface-container-lowest font-label-md text-label-md text-primary font-bold shadow-sm transition-all flex items-center gap-1 cursor-pointer";
    btnSpeedTurtle.className = "px-3 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant font-medium hover:text-on-surface transition-all flex items-center gap-1 cursor-pointer";
  });

  btnSpeedTurtle.addEventListener('click', () => {
    btnSpeedTurtle.className = "px-3 py-1.5 rounded-full bg-surface-container-lowest font-label-md text-label-md text-primary font-bold shadow-sm transition-all flex items-center gap-1 cursor-pointer";
    btnSpeedNormal.className = "px-3 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant font-medium hover:text-on-surface transition-all flex items-center gap-1 cursor-pointer";
  });

  // Audio Playback Visualizer
  const playBtn = document.getElementById('play-audio-btn');
  const playIcon = document.getElementById('play-icon');
  const pulseEl = document.getElementById('audio-pulse');
  let isPlayingAudio = false;

  playBtn.addEventListener('click', () => {
    if (isPlayingAudio) return;
    isPlayingAudio = true;
    playIcon.textContent = 'pause';
    pulseEl.classList.add('scale-125', 'bg-primary/20');
    
    setTimeout(() => {
      isPlayingAudio = false;
      playIcon.textContent = 'play_arrow';
      pulseEl.classList.remove('scale-125', 'bg-primary/20');
    }, 4000);
  });

  // Transcript Collapsible Reveal
  const transcriptToggle = document.getElementById('toggle-transcript');
  const transcriptBox = document.getElementById('transcript-box');
  const transcriptToggleText = document.getElementById('transcript-toggle-text');

  transcriptToggle.addEventListener('click', () => {
    const isHidden = transcriptBox.classList.contains('hidden');
    if (isHidden) {
      transcriptBox.classList.remove('hidden');
      transcriptToggleText.textContent = "Ocultar texto";
    } else {
      transcriptBox.classList.add('hidden');
      transcriptToggleText.textContent = "Mostrar texto";
    }
  });

  // Tile Selection Mechanics
  const tiles = document.querySelectorAll('.choice-tile');
  tiles.forEach(tile => {
    tile.addEventListener('click', () => {
      tiles.forEach(t => {
        t.classList.remove('bg-primary-fixed/40', 'bg-tertiary-fixed/30');
        t.querySelector('.tile-check').classList.add('opacity-0');
        t.querySelector('.tile-indicator').className = 'tile-indicator w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-on-surface-variant transition-colors';
      });

      tile.classList.add('bg-primary-fixed/40');
      const indicator = tile.querySelector('.tile-indicator');
      indicator.className = 'tile-indicator w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md transition-colors';
      tile.querySelector('.tile-check').classList.remove('opacity-0');
    });
  });

  // Microphone Live Waveform Simulator
  const micBtn = document.getElementById('mic-trigger');
  const micIcon = document.getElementById('mic-icon');
  const micStatus = document.getElementById('mic-status');
  const recognizedLabel = document.getElementById('mic-recognized');
  const waveBars = document.querySelectorAll('.waveform-bar');
  let isRecording = false;
  let waveInterval;

  micBtn.addEventListener('click', () => {
    isRecording = !isRecording;
    if (isRecording) {
      micBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
      micBtn.classList.add('bg-error', 'text-on-error');
      micIcon.textContent = 'graphic_eq';
      micStatus.textContent = 'Escuchando tu voz...';
      micStatus.classList.add('text-primary', 'font-semibold');
      recognizedLabel.classList.add('opacity-0');

      waveBars.forEach(b => {
        b.classList.remove('bg-surface-container-highest');
        b.classList.add('bg-primary');
      });

      waveInterval = setInterval(() => {
        waveBars.forEach(bar => {
          const randHeight = Math.floor(Math.random() * 24) + 6;
          bar.style.height = `${randHeight}px`;
        });
      }, 100);
    } else {
      clearInterval(waveInterval);
      micBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
      micBtn.classList.remove('bg-error', 'text-on-error');
      micIcon.textContent = 'mic';
      micStatus.textContent = 'Grabado con éxito';
      micStatus.classList.remove('text-primary', 'font-semibold');
      recognizedLabel.classList.remove('opacity-0');

      waveBars.forEach(b => {
        b.classList.add('bg-tertiary-container');
        b.classList.remove('bg-primary');
        b.style.height = '6px';
      });

      // Auto-highlight correct answer when speech succeeds
      const correctTile = document.querySelector('[data-correct="true"]');
      if (correctTile) correctTile.click();
    }
  });
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-2px_14px_rgba(44,34,30,0.05)]"><div class="px-margin py-3 flex items-center"><button class="w-full h-13 min-h-[52px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-[0_3px_0_#822801] active:translate-y-0.5 active:shadow-[0_1px_0_#822801] transition-transform flex items-center justify-center gap-space-sm" id="action-btn">Comprobar</button></div></footer></body></html>
