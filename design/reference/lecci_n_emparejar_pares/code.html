</div>
<div class="relative flex-1 bg-surface-container-lowest py-2.5 px-3.5 rounded-xl shadow-[0_2px_8px_rgba(44,34,30,0.05)]">
<!-- Speech tail -->
<div class="absolute -left-1.5 top-1/2 -translate-y-1/2 w-3 h-3 bg-surface-container-lowest rotate-45 rounded-[2px]"></div>

<!-- Matching Interactive Grid -->
<div class="grid grid-cols-2 gap-2.5 w-full" id="pairs-container">
<!-- Pair 1: Completed / Solved State (Green / Agave Theme) -->
<button class="group relative flex flex-col items-center justify-center p-3.5 min-h-[64px] rounded-2xl bg-tertiary-fixed text-on-tertiary-fixed shadow-[0_1px_3px_rgba(44,34,30,0.04)] cursor-default transition-all" disabled="" type="button">
<div class="flex items-center gap-1.5 text-center">
<span class="font-headline-sm text-headline-sm font-bold">¿Te parece si...?</span>
<span class="material-symbols-outlined text-[18px] text-tertiary font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-label-sm text-label-sm text-tertiary opacity-85 mt-0.5">Emparejado</span>
</button>
<button class="group relative flex flex-col items-center justify-center p-3.5 min-h-[64px] rounded-2xl bg-tertiary-fixed text-on-tertiary-fixed shadow-[0_1px_3px_rgba(44,34,30,0.04)] cursor-default transition-all" disabled="" type="button">
<div class="flex items-center gap-1.5 text-center">
<span class="font-headline-sm text-headline-sm font-bold">How about if we...?</span>
<span class="material-symbols-outlined text-[18px] text-tertiary font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-label-sm text-label-sm text-tertiary opacity-85 mt-0.5">Correcto</span>
</button>
<!-- Pair 2: Active Selected State (Left active, Right awaiting tap) -->
<button class="tile-card selected relative flex flex-col items-center justify-center p-3.5 min-h-[64px] rounded-2xl bg-primary-fixed text-on-primary-fixed-variant shadow-[0_2px_8px_rgba(159,60,22,0.15)] translate-y-0.5 transition-all text-center" data-match="see-you" type="button">
<span class="font-headline-sm text-headline-sm font-bold text-primary">Nos vemos</span>
<span class="font-label-sm text-label-sm text-primary opacity-80 mt-0.5">Seleccionado</span>
</button>
<button class="tile-card relative flex flex-col items-center justify-center p-3.5 min-h-[64px] rounded-2xl bg-surface-container-lowest text-on-surface shadow-[0_4px_12px_rgba(44,34,30,0.06)] active:translate-y-0.5 active:shadow-sm transition-all text-center" data-match="totally" type="button">
<span class="font-headline-sm text-headline-sm font-medium">Totally! / I'm in!</span>
</button>
<!-- Pair 3: Neutral cards -->
<button class="tile-card relative flex flex-col items-center justify-center p-3.5 min-h-[64px] rounded-2xl bg-surface-container-lowest text-on-surface shadow-[0_4px_12px_rgba(44,34,30,0.06)] active:translate-y-0.5 active:shadow-sm transition-all text-center" data-match="close-to-me" type="button">
<span class="font-headline-sm text-headline-sm font-medium">Me queda cerca</span>
</button>
<button class="tile-card relative flex flex-col items-center justify-center p-3.5 min-h-[64px] rounded-2xl bg-surface-container-lowest text-on-surface shadow-[0_4px_12px_rgba(44,34,30,0.06)] active:translate-y-0.5 active:shadow-sm transition-all text-center" data-match="see-you" type="button">
<span class="font-headline-sm text-headline-sm font-medium">See you</span>
</button>
<!-- Pair 4: Neutral cards -->
<button class="tile-card relative flex flex-col items-center justify-center p-3.5 min-h-[64px] rounded-2xl bg-surface-container-lowest text-on-surface shadow-[0_4px_12px_rgba(44,34,30,0.06)] active:translate-y-0.5 active:shadow-sm transition-all text-center" data-match="lunch" type="button">
<span class="font-headline-sm text-headline-sm font-medium">Almorzar</span>
</button>
<button class="tile-card relative flex flex-col items-center justify-center p-3.5 min-h-[64px] rounded-2xl bg-surface-container-lowest text-on-surface shadow-[0_4px_12px_rgba(44,34,30,0.06)] active:translate-y-0.5 active:shadow-sm transition-all text-center" data-match="close-to-me" type="button">
<span class="font-headline-sm text-headline-sm font-medium">It's close to me</span>
</button>
<!-- Pair 5: Neutral cards -->

<span class="font-headline-sm text-headline-sm font-medium">De una</span>
<span class="font-label-sm text-label-sm text-on-surface-variant/70 mt-0.5">Coloquial</span>
</button>
<button class="tile-card relative flex flex-col items-center justify-center p-3.5 min-h-[64px] rounded-2xl bg-surface-container-lowest text-on-surface shadow-[0_4px_12px_rgba(44,34,30,0.06)] active:translate-y-0.5 active:shadow-sm transition-all text-center" data-match="lunch" type="button">
<span class="font-headline-sm text-headline-sm font-medium">To have lunch</span>
</button>
</div>
<!-- Mascot Audio Micro-interaction Trigger -->
<div class="mt-4 flex items-center justify-center">
<button class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">volume_up</span>
<span class="font-label-md text-label-md">Escuchar pronunciación</span>
</button>
</div>
</div>
<script>
  (function() {
    const tiles = document.querySelectorAll('.tile-card:not([disabled])');
    let firstSelected = document.querySelector('.tile-card.selected');

    tiles.forEach(tile => {
      tile.addEventListener('click', function() {
        if (this.disabled) return;

        if (!firstSelected) {
          firstSelected = this;
          this.classList.add('selected', 'bg-primary-fixed', 'text-on-primary-fixed-variant', 'translate-y-0.5');
          this.classList.remove('bg-surface-container-lowest', 'text-on-surface');
          return;
        }

        if (firstSelected === this) {
          firstSelected.classList.remove('selected', 'bg-primary-fixed', 'text-on-primary-fixed-variant', 'translate-y-0.5');
          firstSelected.classList.add('bg-surface-container-lowest', 'text-on-surface');
          firstSelected = null;
          return;
        }

        const matchA = firstSelected.getAttribute('data-match');
        const matchB = this.getAttribute('data-match');

        if (matchA && matchA === matchB) {
          // Success Pair Match
          [firstSelected, this].forEach(el => {
            el.classList.remove('selected', 'bg-primary-fixed', 'text-on-primary-fixed-variant', 'bg-surface-container-lowest', 'text-on-surface');
            el.classList.add('bg-tertiary-fixed', 'text-on-tertiary-fixed', 'shadow-sm');
            el.setAttribute('disabled', 'true');
            el.style.pointerEvents = 'none';
            
            // Add subtle checkmark icon if not present
            if (!el.querySelector('.material-symbols-outlined')) {
              const icon = document.createElement('span');
              icon.className = 'material-symbols-outlined text-[18px] text-tertiary font-bold ml-1 align-middle';
              icon.style.fontVariationSettings = "'FILL' 1";
              icon.textContent = 'check_circle';
              const titleSpan = el.querySelector('span');
              if (titleSpan) titleSpan.appendChild(icon);
            }
          });
          firstSelected = null;
        } else {
          // Mismatched
          this.classList.add('bg-error-container', 'text-on-error-container');
          setTimeout(() => {
            this.classList.remove('bg-error-container', 'text-on-error-container');
            if (firstSelected) {
              firstSelected.classList.remove('selected', 'bg-primary-fixed', 'text-on-primary-fixed-variant', 'translate-y-0.5');
              firstSelected.classList.add('bg-surface-container-lowest', 'text-on-surface');
              firstSelected = null;
            }
          }, 350);
        }
      });
    });
  })();
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-2px_14px_rgba(44,34,30,0.05)]"><div class="px-margin py-3 flex items-center"><button class="w-full h-13 min-h-[52px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-[0_3px_0_#822801] active:translate-y-0.5 active:shadow-[0_1px_0_#822801] transition-transform flex items-center justify-center gap-space-sm" id="action-btn">Comprobar</button></div></footer></body></html>
