tween gap-gutter"><button aria-label="Salir de la lección" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">close</span></button><div class="flex-1 flex flex-col justify-center px-1"><div class="w-full h-2.5 bg-surface-container-high rounded-full overflow-hidden"><div class="h-full bg-primary rounded-full transition-all duration-300" style="width: 60%;"></div></div></div><div class="flex items-center gap-1 bg-surface-container-low px-2.5 py-1 rounded-full"><span class="material-symbols-outlined text-error text-[18px]">favorite</span><span class="font-label-md text-label-md text-on-surface">4</span></div><img alt="Profile" class="w-8 h-8 rounded-full object-cover ml-1" src="https://lh3.googleusercontent.com/aida/ALJJyrDMD3SutDIacnBloy_b1ONZZNwO-fi-IGkecyD5vNCBKShrFNN9cDHUdQU9atePc2w0WsvCgG20AOVU7J2P5fmzojemmyoSKJvQyIMsyeJBjNEtfR_9buvQmLLP0A7YdpSSlkysMVuM_uL7VRbKbgqSTixKDHYMqywb6wzRH2j9wgmR2KaNKJ-syN75W-nzGVlZGRh0OcbNcQxE6Gwdya9NaB4ahmpAiezY5ifE86n4TdDmzEp3Trno0g"/></div></header><main class="flex flex-col relative w-full px-margin pt-16 pb-24 bg-surface flex-1"><div class="flex flex-col w-full pb-6">
<!-- Instruction / Prompt Title -->
<div class="flex flex-col gap-1 mb-4">
<span class="font-label-md text-label-md text-primary font-bold uppercase tracking-wider">Traducción Guiada</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Arma esta oración</h1>
</div>
<!-- Dachshund Mascot & Dialogue Balloon -->
<div class="flex items-end gap-3 mb-5">
<div class="relative shrink-0 w-20 h-20 rounded-full bg-secondary-fixed/50 p-1 shadow-sm overflow-hidden flex items-center justify-center">
<img alt="Mascota Mushroom" class="w-full h-full object-cover object-center scale-110" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDRUV_JDr1YerjasGrXxc2WdFazA2Q2eThPYp52kFIUtn7tIYMB_9sVNxKwHeVYtAB2lWXULC5-nwC6S4qD-aBusQ9wvUyNAMxKRZjor_rsQfENt8Sm-zAujuLv08L2wXD80I5Fqwf3AbIr2529Esa0vvB6AsLr7l-kntSr6R0qF_5RJvsh8i33kcbdCqIhMhALCJLm9hzgvooM_Nc3OFSovfbrsRu8i5xulTanPhSsU2sZH3iiEcUS"/>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container shadow">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
</div>
<!-- Speech Bubble -->
<div class="relative flex-1 bg-surface-container-lowest p-3.5 rounded-2xl shadow-sm text-on-surface">
<!-- Triangle Indicator -->
<div class="absolute -left-2 bottom-3 w-0 h-0 border-y-8 border-y-transparent border-r-8 border-r-surface-container-lowest"></div>
<p class="font-body-sm text-body-sm text-on-surface-variant font-medium leading-relaxed">
<span class="font-bold text-primary">Pista:</span> Recuerda usar la frase habitual <span class="font-semibold text-on-surface">«Nos vemos en...»</span>
</p>
</div>
</div>
<!-- Prompt Sentence Card with Audio -->
<div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm mb-6 flex items-center justify-between gap-3">
<div class="flex items-center gap-3">
<button aria-label="Escuchar audio" class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed active:scale-95 transition-transform" id="tts-btn">
<span class="material-symbols-outlined text-[24px]">volume_up</span>
</button>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Inglés</span>
<span class="font-headline-md text-headline-md text-on-surface">"Let's meet at Café Revolución."</span>
</div>
</div>
</div>
<!-- Construction Slot Zone -->
<div class="w-full flex flex-col gap-2 mb-8">
<div class="flex items-center justify-between px-1">
<span class="font-label-sm text-label-sm text-on-surface-variant font-semibold">Tu respuesta:</span>
<button class="font-label-sm text-label-sm text-primary hover:underline" id="clear-all">Reiniciar</button>
</div>
<div class="min-h-[104px] w-full bg-surface-container-low rounded-2xl p-3 flex flex-wrap gap-2.5 items-center content-start shadow-inner" id="target-zone">
<!-- Selected Word Chips (Initial State) -->
<button class="word-chip-selected flex items-center gap-1.5 h-11 px-4 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:scale-95 transition-all" data-word="Nos vemos">
<span>Nos vemos</span>
</button>
<button class="word-chip-selected flex items-center gap-1.5 h-11 px-4 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:scale-95 transition-all" data-word="en">
<span>en</span>
</button>
<button class="word-chip-selected flex items-center gap-1.5 h-11 px-4 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:scale-95 transition-all" data-word="el">
<span>el</span>
</button>
<div class="h-9 w-12 border-b-2 border-primary/30 animate-pulse rounded-sm" id="drop-indicator"></div>
</div>
</div>
<!-- Word Bank Section -->
<div class="flex flex-col gap-3">
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-outline text-[18px]">touch_app</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-semibold tracking-wide uppercase">Banco de palabras</span>
</div>
<div class="flex flex-wrap justify-center gap-2.5 p-2" id="word-bank">
<!-- Tappable Words -->
<button class="word-tile h-12 px-5 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:translate-y-0.5 active:shadow-none transition-all flex items-center justify-center select-none" data-word="Café">
        Café
      </button>
<button class="word-tile h-12 px-5 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:translate-y-0.5 active:shadow-none transition-all flex items-center justify-center select-none" data-word="Revolución">
        Revolución
      </button>
<button class="word-tile h-12 px-5 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:translate-y-0.5 active:shadow-none transition-all flex items-center justify-center select-none" data-word="mañana">
        mañana
      </button>
<button class="word-tile h-12 px-5 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:translate-y-0.5 active:shadow-none transition-all flex items-center justify-center select-none" data-word="ayer">
        ayer
      </button>
<button class="word-tile h-12 px-5 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:translate-y-0.5 active:shadow-none transition-all flex items-center justify-center select-none" data-word="viernes">
        viernes
      </button>
</div>
</div>
<!-- Decorative Culture Micro-Badge -->
<div class="mt-6 mx-auto flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-tertiary">eco</span>
<span class="font-label-sm text-label-sm">Expresión cotidiana en CDMX</span>
</div>
</div>
<script>
  (function () {
    const targetZone = document.getElementById('target-zone');
    const wordBank = document.getElementById('word-bank');
    const indicator = document.getElementById('drop-indicator');
    const actionBtn = document.getElementById('action-btn');
    const clearBtn = document.getElementById('clear-all');

    // Make initial selected chips interactive to send them back to the bank
    function attachSelectedChipListener(chip) {
      chip.addEventListener('click', () => {
        const wordText = chip.getAttribute('data-word');
        chip.remove();

        // Create new button back in the word bank
        const bankButton = document.createElement('button');
        bankButton.className = 'word-tile h-12 px-5 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:translate-y-0.5 active:shadow-none transition-all flex items-center justify-center select-none';
        bankButton.setAttribute('data-word', wordText);
        bankButton.textContent = wordText;
        attachWordBankListener(bankButton);
        wordBank.appendChild(bankButton);
      });
    }

    // Attach click to current selected chips
    document.querySelectorAll('.word-chip-selected').forEach(attachSelectedChipListener);

    function attachWordBankListener(tile) {
      tile.addEventListener('click', () => {
        const word = tile.getAttribute('data-word');
        tile.remove();

        const newChip = document.createElement('button');
        newChip.className = 'word-chip-selected flex items-center gap-1.5 h-11 px-4 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:scale-95 transition-all';
        newChip.setAttribute('data-word', word);
        newChip.innerHTML = `<span>${word}</span>`;
        attachSelectedChipListener(newChip);

        // Insert before the drop indicator
        targetZone.insertBefore(newChip, indicator);
      });
    }

    // Attach click to all bank words
    document.querySelectorAll('.word-tile').forEach(attachWordBankListener);

    // Audio cue animation
    const ttsBtn = document.getElementById('tts-btn');
    if (ttsBtn) {
      ttsBtn.addEventListener('click', () => {
        ttsBtn.classList.add('bg-primary', 'text-on-primary');
        ttsBtn.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
        setTimeout(() => {
          ttsBtn.classList.remove('bg-primary', 'text-on-primary');
          ttsBtn.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
        }, 600);
      });
    }

    // Clear all action
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        const currentChips = targetZone.querySelectorAll('.word-chip-selected');
        currentChips.forEach(chip => {
          const word = chip.getAttribute('data-word');
          chip.remove();
          const bankButton = document.createElement('button');
          bankButton.className = 'word-tile h-12 px-5 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-sm active:translate-y-0.5 active:shadow-none transition-all flex items-center justify-center select-none';
          bankButton.setAttribute('data-word', word);
          bankButton.textContent = word;
          attachWordBankListener(bankButton);
          wordBank.appendChild(bankButton);
        });
      });
    }

    // Verification Logic for Bottom Bar CTA
    if (actionBtn) {
      actionBtn.addEventListener('click', () => {
        const chips = Array.from(targetZone.querySelectorAll('.word-chip-selected')).map(c => c.getAttribute('data-word'));
        const sentence = chips.join(' ');
        
        if (sentence === 'Nos vemos en el Café Revolución') {
          actionBtn.classList.remove('bg-primary', 'shadow-[0_3px_0_#822801]');
          actionBtn.classList.add('bg-tertiary', 'shadow-[0_3px_0_#2e4d39]');
          actionBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span> ¡Excelente!';
        } else {
          actionBtn.classList.add('animate-pulse');
          setTimeout(() => actionBtn.classList.remove('animate-pulse'), 400);
        }
      });
    }
  })();
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-2px_14px_rgba(44,34,30,0.05)]"><div class="px-margin py-3 flex items-center"><button class="w-full h-13 min-h-[52px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-[0_3px_0_#822801] active:translate-y-0.5 active:shadow-[0_1px_0_#822801] transition-transform flex items-center justify-center gap-space-sm" id="action-btn">Comprobar</button></div></footer></body></html>
